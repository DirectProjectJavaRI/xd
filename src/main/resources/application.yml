---
#mTLS profile: layers on top of the "tls" profile (activate both together, e.g.
#--spring.profiles.active=tls,mtls) to additionally require client certificate
#authentication. server.ssl.client-auth=need makes the TLS handshake itself fail for any
#client that does not present a certificate chaining to a CA in the truststore below - this
#is Spring Boot/Tomcat built-in behavior, no application code is involved.
#
#The truststore below ships a default, self-signed dev/test CA (CN=XD Direct Test Client CA)
#so mTLS can be exercised out of the box. To trust real client certificates in a deployment,
#override spring.ssl.bundle.pem.mybundle.truststore.certificate in your own application.yml
#(or via a config-service/environment property) with your own CA certificate(s) - multiple
#CA certificates can be concatenated in the same PEM value to trust more than one issuer.
#
#Referencing external files instead of inlining PEM/base64 content:
#spring.ssl.bundle.pem.mybundle.truststore.certificate accepts the same two forms as the
#keystore properties documented in the "tls" profile above - either literal inline PEM text,
#or a resource location string. This is especially useful for a truststore, since a real
#deployment's trusted-client-CA list tends to be larger and change more often than a single
#server certificate (partners are onboarded/rotated independently of app releases). Instead of
#concatenating every CA cert as inline PEM here, you can point at an externally-managed file
#(or directory of files) that something else (config management, a secrets manager, an ops
#team) maintains, e.g.:
#  truststore:
#    certificate: file:/etc/xd/tls/trusted-client-cas.pem
#where trusted-client-cas.pem is itself just multiple concatenated `-----BEGIN
#CERTIFICATE-----`...`-----END CERTIFICATE-----` blocks, one per trusted CA. A `classpath:`
#location works the same way if you'd rather ship the trust bundle inside the jar/war.
spring:
  config:
    activate:
      on-profile: mtls
  ssl:
    bundle:
      pem:
        mybundle:
          truststore:
            certificate: |
              -----BEGIN CERTIFICATE-----
              MIIDNzCCAh+gAwIBAgIUauqLzQTwrHuqZh+j7Y5E6a41gHIwDQYJKoZIhvcNAQEL
              BQAwIzEhMB8GA1UEAwwYWEQgRGlyZWN0IFRlc3QgQ2xpZW50IENBMB4XDTI2MDgx
