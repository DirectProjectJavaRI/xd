# automatically expand info properties from the Maven project using resource filtering
info.build.artifact: '@project.artifactId@'
info.build.name: '@project.name@'
info.build.description: '@project.description@'
info.build.version: '@project.version@'

server:
  servlet:
    context-path: /xd

#Default the security credentials to call the config service. Override these
#for your deployment.
direct:
  webservices:
    security:
      basic:
        user:
          name: admin
          password: d1r3ct;

  config:
    service:
      url:  http://localhost:8082

  xd:
    usestreams: true

spring:
  config.import: 'optional:configserver:'

  application:
    name: direct-xd

  jpa:
    open_in_view: false

  main:
    allow-bean-definition-overriding: true

  jmx:
    default-domain:  direct-xd

  cloud:
    stream:
      source: direct-smtp-gateway-message
      bindings:
        direct-smtp-gateway-message-out-0:
          destination: direct-smtp-mq-gateway

#Don't use rabbit as part of the health check
management:
  health:
    rabbit:
      enabled: false

#unique jmx names to avoid collisions when running
#multiple spring boot apps in an web container
endpoints:
  jmx:
    default-domain: direct-xd
    uniqueNames: true

---
#TLS profile: enables HTTPS on the embedded server using a Spring SSL bundle built from an
#inline, self-signed PEM certificate/key (CN=xddirect.com, SAN=DNS:xddirect.com). This is a
#development/default certificate only - replace spring.ssl.bundle.pem.mybundle.keystore.*
#with a CA-issued certificate for production use.
#
#Referencing external files instead of inlining PEM/base64 content:
#spring.ssl.bundle.pem.mybundle.keystore.certificate and .private-key each accept either the
#literal PEM text (as used below) OR a resource location string pointing at a file containing
#that same PEM text - Spring resolves either form the same way it resolves any other Spring
#Resource location. This is often easier to manage than inlining base64/PEM directly in YAML
#when certificates rotate independently of application config, are managed by a separate
#process (e.g. cert-manager, ACME/Let's Encrypt, an internal PKI), or you simply don't want
#key material committed alongside this file. To use it, replace the block scalar (`|`) values
#below with a location string, e.g.:
#  keystore:
#    certificate: file:/etc/xd/tls/server-cert.pem
#    private-key: file:/etc/xd/tls/server-key.pem
#`classpath:` locations work the same way (e.g. classpath:tls/server-cert.pem) if you'd rather
#package the files inside the application jar/war than reference an absolute filesystem path.
#A private key stored encrypted can be paired with .private-key-password to supply the
#decryption passphrase (e.g. keystore.private-key-password: ${TLS_KEY_PASSWORD}).
